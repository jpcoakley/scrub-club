# The site's API: team data from the Scrub Club Airtable base, email-code sign-in, In/Out,
# Beer Man and award assignments. Secrets: AIRTABLE_TOKEN (wrangler secret put).
# Deploy: cd worker && npx wrangler deploy (wrangler is signed in by OAuth on JP's Mac).
name = "scrub-club-api"
main = "worker.js"
compatibility_date = "2026-08-01"
account_id = "4b65c3e179376d3874d25be52073276d"

# The site itself stays on GitHub Pages; only this hostname reaches the Worker.
routes = [
  { pattern = "api.scrubclubhockeyteam.com", custom_domain = true }
]

[[kv_namespaces]]
binding = "SC_KV"
id = "1ed90cad12c94c33917afab4fd90716f"

# Cloudflare Email Service; the sender's domain must be one the account is set up to send from
[[send_email]]
name = "EMAIL"

# keep Worker logs so a failed sign-in can be traced after the fact
[observability]
enabled = true

[vars]
# scrubclubhockeyteam.com was onboarded under Email Service > Email Sending on
# Sep 17, 2026 (that wrote the cf-bounce MX, SPF and DKIM records). waturi@ is
# also the team's real mailbox: Cloudflare Email Routing forwards it to JP's Gmail,
# so replies to a code email land somewhere a person reads.
MAIL_FROM = "waturi@scrubclubhockeyteam.com"
MAIL_FROM_NAME = "Scrub Club Hockey"
